<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4F7A" />
      <stop offset="100%" stop-color="#0E2C44" />
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#heroGrad)"/>
  
  <!-- Subtle architectural skyline illustration -->
  <g fill="#FFFFFF" opacity="0.08">
    <rect x="50" y="200" width="120" height="300" rx="4"/>
    <rect x="190" y="140" width="140" height="360" rx="4"/>
    <rect x="350" y="230" width="110" height="270" rx="4"/>
    <rect x="480" y="110" width="160" height="390" rx="4"/>
    <rect x="660" y="180" width="130" height="320" rx="4"/>
    <rect x="810" y="130" width="150" height="370" rx="4"/>
    <rect x="980" y="210" width="140" height="290" rx="4"/>
  </g>

  <!-- Decorative geometric accents -->
  <circle cx="1050" cy="120" r="80" fill="#27AE60" opacity="0.15"/>
  <circle cx="150" cy="400" r="100" fill="#F39C12" opacity="0.12"/>
</svg>
