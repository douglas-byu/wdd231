<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e44ad" />
      <stop offset="100%" stop-color="#5b2c6f" />
    </linearGradient>
    <filter id="shadow04" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#grad04)"/>
  
  <!-- Architectural silhouette pattern -->
  <g opacity="0.12" fill="#FFFFFF">
    <rect x="40" y="140" width="110" height="260" rx="4"/>
    <rect x="180" y="80" width="140" height="320" rx="4"/>
    <rect x="350" y="160" width="120" height="240" rx="4"/>
    <rect x="490" y="110" width="90" height="290" rx="4"/>
    <!-- Windows -->
    <circle cx="250" cy="120" r="10"/>
    <circle cx="250" cy="160" r="10"/>
    <circle cx="250" cy="200" r="10"/>
  </g>

  <!-- Illustration Card -->
  <g filter="url(#shadow04)" transform="translate(150, 60)">
    <rect width="300" height="230" rx="16" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Roof / top accent -->
    <path d="M 150 25 L 260 95 L 40 95 Z" fill="#8e44ad"/>
    <!-- House body -->
    <rect x="65" y="95" width="170" height="110" rx="4" fill="#F4F6F9"/>
    <!-- Door -->
    <rect x="130" y="145" width="40" height="60" rx="4" fill="#5b2c6f"/>
    <circle cx="162" cy="175" r="3" fill="#FFFFFF"/>
    <!-- Windows -->
    <rect x="85" y="115" width="30" height="30" rx="3" fill="#27AE60" fill-opacity="0.8"/>
    <rect x="185" y="115" width="30" height="30" rx="3" fill="#27AE60" fill-opacity="0.8"/>
  </g>

  <!-- Badge Type -->
  <g transform="translate(30, 30)">
    <rect width="140" height="36" rx="18" fill="#1A4F7A" filter="url(#shadow04)"/>
    <text x="70" y="23" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cobertura</text>
  </g>

  <!-- Price Tag -->
  <g transform="translate(420, 30)">
    <rect width="150" height="36" rx="18" fill="#27AE60" filter="url(#shadow04)"/>
    <text x="75" y="23" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">R$ 7.500/mês</text>
  </g>

  <!-- Neighborhood footer badge -->
  <rect y="335" width="600" height="65" fill="#000000" fill-opacity="0.75"/>
  <text x="30" y="375" font-family="'Poppins', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">📍 Cerqueira César, São Paulo</text>
  <text x="570" y="375" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="end">Disponível para Locação ★</text>
</svg>

